<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#eceff8;--s1:#cbd0e3;--s2:#ffffff;--tx:#1b2440;--mut:#7c84a0;--track:#dde1ee;--ok:#1f9d55;--okb:#e2f5e9;--bad:#d64545;--badb:#fcebeb;--amb:#d98a14;--ac:#16315f;--ff:"Nunito","Hind Siliguri",system-ui,sans-serif;color-scheme:light}
[data-theme=dark]{--bg:#1f2233;--s1:#141624;--s2:#2a2e46;--tx:#e8eaf6;--mut:#8f96b5;--track:#2a2e45;--okb:#14301f;--badb:#35161a;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{font-size:16px}
body{background:var(--bg);color:var(--tx);font-family:var(--ff);line-height:1.55;overflow-x:hidden}
.shell{max-width:980px;margin:0 auto;padding:20px 18px 110px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
h1{font-size:1.5rem;font-weight:800}h3{font-size:1.05rem;font-weight:700;margin-bottom:6px}
h3.sec{margin:8px 4px 14px}
.mut{color:var(--mut);font-size:.88rem}
u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.card{background:var(--bg);border-radius:24px;padding:18px;min-width:0;box-shadow:8px 8px 18px var(--s1),-8px -8px 18px var(--s2)}
.click{cursor:pointer}
.inset{box-shadow:inset 4px 4px 9px var(--s1),inset -4px -4px 9px var(--s2)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:18px}
.big{font-size:2rem;font-weight:800;line-height:1.15}
.up{color:var(--ok)}.dn{color:var(--bad)}.sk{color:var(--amb)}
.rwrap{border-radius:50%;padding:8px;background:var(--bg);box-shadow:6px 6px 14px var(--s1),-6px -6px 14px var(--s2);display:inline-flex;max-width:100%}
.rwrap svg{max-width:100%;height:auto}
.rt{font-size:1.15rem;font-weight:800;fill:var(--tx)}
.rc{display:flex;align-items:center;gap:14px}
.donut{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:26px}
.leg div{color:var(--mut);font-size:.92rem}.leg b{color:var(--tx);font-size:1.05rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px}
.tile{border:0;font:inherit;color:inherit;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.tile:active{box-shadow:inset 4px 4px 9px var(--s1),inset -4px -4px 9px var(--s2)}
.track{height:10px;width:100%;border-radius:6px;background:var(--bg);box-shadow:inset 2px 2px 5px var(--s1),inset -2px -2px 5px var(--s2);overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;background:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.chip,.btn,select{background:var(--bg);border:0;color:var(--tx);border-radius:999px;padding:8px 18px;font:inherit;font-weight:600;cursor:pointer;box-shadow:5px 5px 11px var(--s1),-5px -5px 11px var(--s2)}
.chip.on,.seg button.on{box-shadow:inset 3px 3px 7px var(--s1),inset -3px -3px 7px var(--s2);color:var(--ac);font-weight:800}
[data-theme=dark] .chip.on,[data-theme=dark] .seg button.on{color:var(--tx)}
.btn:active{box-shadow:inset 3px 3px 7px var(--s1),inset -3px -3px 7px var(--s2)}
.btn.p{background:var(--ac);color:#fff}
.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.q{margin-top:18px}
.qh{display:flex;justify-content:space-between;color:var(--mut);font-size:.88rem;margin-bottom:10px}
.stem{font-size:1.2rem;font-weight:600;margin-bottom:16px}.stem p{margin:0}
.opt{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:18px;cursor:pointer;margin-bottom:12px;background:var(--bg);box-shadow:4px 4px 10px var(--s1),-4px -4px 10px var(--s2)}
.opt b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:.85rem;color:var(--mut);box-shadow:inset 2px 2px 5px var(--s1),inset -2px -2px 5px var(--s2)}
.opt.done{cursor:default}
.opt.ok{background:var(--okb);box-shadow:inset 0 0 0 2px var(--ok)}.opt.ok b{color:var(--ok)}
.opt.bad{background:var(--badb);box-shadow:inset 0 0 0 2px var(--bad)}.opt.bad b{color:var(--bad)}
.sol{border-radius:20px;padding:16px;margin-top:8px}
.sol h4{margin-bottom:6px;font-weight:700}
.md table{border-collapse:collapse;margin:8px 0}.md td,.md th{border:1px solid var(--track);padding:4px 10px}
.md p{margin:0 0 .5em}.md ul,.md ol{margin:0 0 .5em 1.3em}.md h3,.md h2{font-size:1.05rem;margin:.3em 0}
mark{background:#ffe14d;color:#1b2440;border-radius:3px;padding:0 2px}
.acts{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap;align-items:center}
.dd{position:relative}
.menu{position:absolute;bottom:115%;left:0;z-index:15;min-width:150px;padding:8px;border-radius:18px;background:var(--bg);box-shadow:6px 6px 14px var(--s1),-6px -6px 14px var(--s2)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);font:inherit;font-weight:600;padding:8px 12px;border-radius:12px;cursor:pointer}
.menu button:hover{background:var(--track)}
.cd{height:5px;border-radius:4px;margin-top:14px;overflow:hidden;background:var(--track)}
.cd i{display:block;height:100%;width:100%;background:var(--ac);transform-origin:left;animation:cd linear forwards}
@keyframes cd{to{transform:scaleX(0)}}
label{display:block;margin:14px 0 6px;color:var(--mut);font-size:.88rem;font-weight:600}
select{width:100%;border:0;background:var(--bg);color:var(--tx);border-radius:14px;padding:10px 14px;font:inherit;box-shadow:inset 3px 3px 7px var(--s1),inset -3px -3px 7px var(--s2)}
.seg{display:flex;gap:12px}.seg button{flex:1;border:0;background:var(--bg);color:var(--tx);font:inherit;font-weight:600;padding:9px;border-radius:999px;cursor:pointer;box-shadow:5px 5px 11px var(--s1),-5px -5px 11px var(--s2)}
.sw{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid var(--bg);cursor:pointer;box-shadow:4px 4px 9px var(--s1),-4px -4px 9px var(--s2)}
.sw button.on{box-shadow:0 0 0 3px var(--tx)}
.sw input{width:38px;height:38px;border:0;padding:0;background:none;cursor:pointer}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:6px;background:var(--bg);box-shadow:inset 2px 2px 5px var(--s1),inset -2px -2px 5px var(--s2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--bg);box-shadow:3px 3px 8px var(--s1),-3px -3px 8px var(--s2),inset 0 0 0 7px var(--ac)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:var(--ac)}
/* flashcards */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-top:16px}
.note{color:#1b2440;border-radius:6px 6px 18px 6px;padding:12px 14px;box-shadow:4px 6px 12px rgba(0,0,0,.18);min-width:0;display:flex;flex-direction:column;gap:8px}
.note .nb{max-height:210px;overflow:auto;font-size:.95rem;word-break:break-word}
.note.lg{max-width:620px;margin:16px auto 0;font-size:1.15rem;padding:22px;min-height:200px}
.note td,.note th{border-color:rgba(0,0,0,.3)}
.na{display:flex;gap:10px}.na button{border:0;background:rgba(0,0,0,.08);border-radius:999px;font:inherit;font-size:.78rem;font-weight:700;padding:3px 12px;cursor:pointer;color:#1b2440}
.modal{position:fixed;inset:0;background:rgba(10,12,25,.55);z-index:40;display:grid;place-items:center;padding:14px}
.mbox{width:100%;max-width:640px;max-height:92vh;overflow:auto}
.tbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tbar button{border:0;background:var(--bg);color:var(--tx);font:inherit;font-weight:700;padding:6px 12px;border-radius:12px;cursor:pointer;box-shadow:3px 3px 7px var(--s1),-3px -3px 7px var(--s2)}
#edit{min-height:220px;max-height:45vh;overflow:auto;padding:14px;border-radius:16px;background:var(--bg);color:var(--tx);outline:none;box-shadow:inset 3px 3px 7px var(--s1),inset -3px -3px 7px var(--s2)}
.csw{display:flex;gap:12px;margin-top:12px}
.csw button{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;box-shadow:2px 3px 6px rgba(0,0,0,.25)}
.csw button.on{box-shadow:0 0 0 3px var(--tx)}
nav{display:flex;gap:6px;padding:10px;margin-bottom:18px;border-radius:30px;background:var(--bg);box-shadow:8px 8px 18px var(--s1),-8px -8px 18px var(--s2)}
nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mut);font:inherit;font-size:.74rem;font-weight:700;padding:8px 2px;border-radius:22px;cursor:pointer}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ac);box-shadow:inset 3px 3px 7px var(--s1),inset -3px -3px 7px var(--s2)}
[data-theme=dark] nav button.on{color:var(--tx)}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--bg);color:var(--bad);padding:10px 18px;border-radius:16px;display:none;max-width:90vw;box-shadow:6px 6px 14px var(--s1),-6px -6px 14px var(--s2);z-index:60}
[hidden]{display:none!important}
@media(max-width:520px){.g2{gap:14px}.card{padding:14px}.rc{flex-direction:column;text-align:center;gap:8px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.big{font-size:1.6rem}.notes{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
@media(max-width:820px){nav{position:fixed;left:12px;right:12px;bottom:12px;margin:0;z-index:20}}
@media(min-width:821px){nav{max-width:620px;margin:0 auto 22px}.shell{padding-bottom:40px}#toast{bottom:24px}}
</style></head><body>
<div class="shell">
<header><h1>Practice Hub</h1><span class="mut" id="meta"></span></header>
<nav id="nav">
 <button data-t="dash" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Dashboard</button>
 <button data-t="questions"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/></svg>Questions</button>
 <button data-t="cards"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h5"/></svg>Cards</button>
 <button data-t="files"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg>Files</button>
 <button data-t="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button>
</nav>
<main>
<section id="t-dash"><div id="ov"></div><h3 class="sec">Subjects</h3><div class="tiles" id="sb"></div></section>

<section id="t-questions" hidden>
 <div class="chips" id="chips"></div>
 <div class="chips" id="stc"></div>
 <div class="tools"><button class="btn p" id="go">Shuffle &amp; start</button><span class="mut" id="cnt"></span></div>
 <div id="card"></div>
</section>

<section id="t-cards" hidden>
 <div class="tools"><button class="btn p" id="addc">+ Add card</button><button class="btn" id="studyb">Study (shuffle)</button><span class="mut" id="ccnt"></span></div>
 <div class="notes" id="cg"></div>
 <div id="sv" hidden></div>
</section>

<section id="t-files" hidden><div id="fl"></div><div id="fv" hidden></div></section>

<section id="t-settings" hidden>
 <div class="card" style="margin-bottom:18px"><h3>Appearance</h3>
  <label>Theme</label><div class="seg" id="theme"><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
  <label>Accent color</label><div class="sw" id="sw"></div>
  <label>Font</label>
  <select id="font"><option value="Nunito">Nunito (default)</option><option value="Nunito Sans">Nunito Sans</option><option value="Hind Siliguri">Hind Siliguri</option><option value="system-ui">System</option></select>
  <label>Text size <span id="szv"></span></label><input type="range" id="size" min="14" max="20" step="1">
 </div>
 <div class="card"><h3>GitHub sync</h3><p class="mut" id="gs">…</p>
  <div class="acts"><button class="btn p" id="sync">Sync now</button></div></div>
</section>
</main></div>

<div class="modal" id="ed" hidden><div class="card mbox">
 <h3 id="edt">New card</h3>
 <div class="tbar" id="tbar">
  <button data-c="bold"><b>B</b></button><button data-c="italic"><i>I</i></button><button data-c="underline"><u>U</u></button><button data-c="strikeThrough"><s>S</s></button>
  <button data-c="h">Heading</button><button data-c="insertUnorderedList">• List</button><button data-c="insertOrderedList">1. List</button>
  <button data-c="mark"><mark>Highlight</mark></button><button data-c="table">Table</button><button data-c="clear">Clear</button>
 </div>
 <div id="edit" contenteditable="true"></div>
 <div class="csw" id="csw"></div>
 <div class="acts"><button class="btn p" id="esave">Save</button><button class="btn" id="ecancel">Cancel</button></div>
</div></div>
<div id="toast"></div>
{% raw %}
<script>
const $=s=>document.querySelector(s);
const SUBJ={B:'Biology',C:'Chemistry',P:'Physics',GK:'GK',E:'English',W:'Weekly',M:'Monthly',T:'Tutorial'};
const P=Object.assign({theme:'light',accent:'#16315f',font:'Nunito',size:16},JSON.parse(localStorage.ui||'{}'));
function applyUI(){
 const r=document.documentElement,ac=P.theme==='dark'&&P.accent==='#16315f'?'#8b93f0':P.accent;
 r.dataset.theme=P.theme;r.style.setProperty('--ac',ac);
 r.style.setProperty('--ff',(P.font==='system-ui'?'system-ui':`"${P.font}"`)+',"Hind Siliguri",system-ui,sans-serif');
 r.style.fontSize=P.size+'px';localStorage.ui=JSON.stringify(P)}
applyUI();

let D=[],filt=new Set(),sv='new',queue=[],cur=0,answered=false,sess={c:0,i:0,s:0},timer=null;
const toast=(m,ok)=>{const t=$('#toast');t.textContent=m;t.style.color=ok?'var(--ok)':'var(--bad)';t.style.display='block';setTimeout(()=>t.style.display='none',ok?2000:5000)};
const post=async(u,b,method='POST')=>{const r=await fetch(u,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});const j=await r.json();if(!r.ok)throw j.error||r.status;return j};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sc=s=>s==='correct'?'up':s==='incorrect'?'dn':s==='skipped'?'sk':'';
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function md(s,inline,br){
 // fix "\\text", "\\pi", "\\frac" (double backslash) and "\_" inside math
 s=(s||'').replace(/\\\\(?=[a-zA-Z]{2,}|[()\[\]])/g,'\\');
 const ph=[];
 s=s.replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$|\\\([\s\S]+?\\\)|\\\[[\s\S]+?\\\]/g,m=>(ph.push(m.replace(/\\+_/g,'_')),'@@'+(ph.length-1)+'@@'));
 s=inline?marked.parseInline(s,{breaks:!!br}):marked.parse(s,{breaks:!!br});
 return s.replace(/@@(\d+)@@/g,(_,i)=>ph[i])}
const math=el=>{try{renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],throwOnError:false})}catch(e){}};

/* tabs */
function tab(t){
 if(t!=='questions'&&timer){cancelT();cur++;show()}
 document.querySelectorAll('main section').forEach(s=>s.hidden=s.id!=='t-'+t);
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 localStorage.tab=t;scrollTo(0,0);
 if(t==='files')filesUI();
 if(t==='cards')loadCards();
 if(t==='settings')gh()}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));

/* stats / dashboard */
const pc=(x,y)=>y?Math.round(x/y*100):0;
function stats(L){let c=0,i=0,s=0;L.forEach(q=>{q.st==='correct'?c++:q.st==='incorrect'?i++:q.st==='skipped'&&s++});return{t:L.length,c,i,s,a:c+i+s}}
function ring(p,size=92){
 const r=size*.4,c=2*Math.PI*r,s=size/2;
 return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${s}" cy="${s}" r="${r}" fill="none" style="stroke:var(--track)" stroke-width="8"/>${p>0?`<circle cx="${s}" cy="${s}" r="${r}" fill="none" style="stroke:var(--ac)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 ${s} ${s})"/>`:''}<text x="${s}" y="${s}" text-anchor="middle" dominant-baseline="central" class="rt">${p}%</text></svg>`}

function dash(){
 const a=stats(D),files=new Set(D.map(q=>q.file)).size,acc=pc(a.c,a.c+a.i),att=pc(a.a,a.t);
 const R=48,C=2*Math.PI*R;let off=0;
 const arc=(n,v)=>{const l=a.t?n/a.t*C:0,e=`<circle r="${R}" cx="62" cy="62" fill="none" style="stroke:var(${v})" stroke-width="14" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 62 62)"/>`;off+=l;return e};
 $('#meta').textContent=`${files} files · ${a.t} questions`;
 $('#ov').innerHTML=`
 <div class="g2"><div class="card"><div class="big">${a.t}</div><div class="mut">Total questions</div></div><div class="card click" id="gofiles"><div class="big">${files}</div><div class="mut">Files ›</div></div></div>
 <div class="g2"><div class="card rc"><span class="rwrap">${ring(acc)}</span><div><div class="mut">Accuracy</div><div class="mut">${a.c} / ${a.c+a.i}</div></div></div>
 <div class="card rc"><span class="rwrap">${ring(att)}</span><div><div class="mut">Attempted</div><div class="mut">${a.a} / ${a.t}</div></div></div></div>
 <div class="card donut"><span class="rwrap" style="padding:12px"><svg width="124" height="124" viewBox="0 0 124 124"><circle r="${R}" cx="62" cy="62" fill="none" style="stroke:var(--track)" stroke-width="14"/>${arc(a.c,'--ok')}${arc(a.i,'--bad')}${arc(a.s,'--amb')}</svg></span>
 <div class="leg"><div><b class="up">${a.c}</b> correct</div><div><b class="dn">${a.i}</b> incorrect</div><div><b class="sk">${a.s}</b> skipped</div><div><b>${a.t-a.a}</b> unattempted</div></div></div>`;
 $('#gofiles').onclick=()=>tab('files');
 $('#sb').innerHTML=Object.keys(SUBJ).map(k=>{
  const L=D.filter(q=>q.k===k),s=stats(L),f=new Set(L.map(q=>q.file)).size;
  return`<button class="card tile" data-k="${k}"><span class="rwrap">${ring(pc(s.c,s.c+s.i),84)}</span><b>${SUBJ[k]}</b><span class="mut">${s.a}/${s.t} done · ${f} files</span><div class="track"><i style="width:${pc(s.a,s.t)}%"></i></div></button>`}).join('');
 $('#sb').querySelectorAll('.tile').forEach(b=>b.onclick=()=>{filt=new Set([b.dataset.k]);chips();tab('questions');build()})}

/* questions */
const STF=[['new','Unattempted'],['all','All questions'],['incorrect','Incorrect'],['skipped','Skipped'],['correct','Correct']];
function chips(){
 $('#chips').innerHTML=Object.entries(SUBJ).map(([k,v])=>`<button class="chip${filt.has(k)?' on':''}" data-k="${k}">${v}</button>`).join('');
 $('#chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filt.has(b.dataset.k)?filt.delete(b.dataset.k):filt.add(b.dataset.k);chips();build()})}
function stc(){
 $('#stc').innerHTML=STF.map(([k,v])=>`<button class="chip${sv===k?' on':''}" data-k="${k}">${v}</button>`).join('');
 $('#stc').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{sv=b.dataset.k;stc();build()})}
function build(){
 queue=D.filter(q=>(!filt.size||filt.has(q.k))&&(sv==='all'||(sv==='new'?!q.st:q.st===sv)));
 shuf(queue);cur=0;sess={c:0,i:0,s:0};show()}

function cancelT(){clearTimeout(timer);timer=null;const b=$('#cd');if(b)b.hidden=true}
function sched(ms){
 cancelT();const b=$('#cd');
 if(b){const i=b.firstElementChild;b.hidden=false;i.style.animation='none';i.offsetWidth;i.style.animation='';i.style.animationDuration=ms+'ms'}
 timer=setTimeout(()=>{timer=null;cur++;show()},ms)}

function show(){
 cancelT();
 if(!queue.length){$('#card').innerHTML='<div class="card q mut">No questions match these filters.</div>';$('#cnt').textContent='';return}
 if(cur>=queue.length){$('#card').innerHTML=`<div class="card q">Round complete: ${sess.c} correct, ${sess.i} incorrect, ${sess.s} skipped.<div class="acts"><button class="btn p" id="again">Shuffle again</button></div></div>`;$('#again').onclick=build;return}
 answered=false;const q=queue[cur];
 $('#cnt').textContent=`${cur+1} / ${queue.length}`;
 $('#card').innerHTML=`<div class="card q"><div class="qh"><span>${q.file.replace('.md','')} · Q${q.n}</span><span class="${sc(q.st)}">${q.st||'new'}</span></div>
 <div class="stem">${md(q.stem)}</div>
 <div id="opts">${q.opts.map((o,i)=>`<div class="opt" data-i="${i}"><b>${'ABCD'[i]||i+1}</b><span>${md(o,1)}</span></div>`).join('')}</div>
 <div id="sol"></div>
 <div class="acts"><button class="btn" id="skip">Skip</button>
  <div class="dd"><button class="btn p" id="atc">Add to card ▾</button><div class="menu" id="atm" hidden><button data-m="mcq">MCQ</button><button data-m="exp">Explanation</button><button data-m="both">Both</button></div></div></div>
 <div class="cd" id="cd" hidden><i></i></div></div>`;
 math($('#card'));
 $('#opts').querySelectorAll('.opt').forEach(o=>o.onclick=()=>pick(+o.dataset.i));
 $('#skip').onclick=async()=>{if(!answered)await mark(q,'skipped');cur++;show()};
 $('#atc').onclick=e=>{e.stopPropagation();const m=$('#atm');m.hidden=!m.hidden;if(!m.hidden)cancelT();else if(answered)sched(2000)};
 $('#atm').querySelectorAll('button').forEach(b=>b.onclick=async e=>{e.stopPropagation();$('#atm').hidden=true;await addCard(q,b.dataset.m);if(answered)sched(1500)})}
document.addEventListener('click',()=>{const m=$('#atm');if(m&&!m.hidden){m.hidden=true;if(answered)sched(2000)}});

async function mark(q,st){
 try{await post('/api/status',{file:q.file,n:q.n,status:st});q.st=st;sess[st[0]]++;dash()}
 catch(e){toast('Save failed: '+e)}}
async function pick(i){
 if(answered)return;answered=true;const q=queue[cur],a=q.ans;
 document.querySelectorAll('.opt').forEach((o,k)=>{o.classList.add('done');if(k===a)o.classList.add('ok');else if(k===i)o.classList.add('bad')});
 $('#skip').hidden=true;sol();
 sched(a>=0&&i===a?1000:5000);   // correct: 1s, incorrect: 5s
 if(a<0)toast('Could not read the answer; check the "## answer" line.');
 else await mark(q,i===a?'correct':'incorrect')}
function sol(){
 const q=queue[cur];
 $('#sol').innerHTML=`<div class="sol inset"><h4>Solution</h4>${q.ans>=0?`<p class="mut">Answer: ${'ABCD'[q.ans]}</p>`:''}<div class="md">${q.exp?md(q.exp):'<p class="mut">No explanation.</p>'}</div></div>`;
 math($('#sol'))}

/* add question -> flashcard */
function cardMd(q,m){
 const stem='**Q:** '+q.stem;
 const opts=q.opts.map((o,i)=>`- ${'ABCD'[i]||i+1}. ${i===q.ans?'**'+o+' ✓**':o}`).join('\n');
 const ans=q.ans>=0?`**Answer:** ${'ABCD'[q.ans]}`:'';
 if(m==='mcq')return [stem,opts].join('\n\n');
 if(m==='exp')return [stem,ans,q.exp].filter(Boolean).join('\n\n');
 return [stem,opts,ans,q.exp].filter(Boolean).join('\n\n')}
async function addCard(q,m){
 if(m!=='mcq'&&!q.exp){toast('No explanation to add');return}
 try{await post('/api/cards',{body:cardMd(q,m),color:'#fff3a3'});toast('Added to cards',1)}
 catch(e){toast('Card save failed: '+e)}}

/* flashcards */
let C=[],deck=[],di=0,edId=null,edColor='#fff3a3';
const CC=['#fff3a3','#ffd6e0','#d4f5dd','#d6e8ff','#ead9ff'];
async function loadCards(){
 try{C=await (await fetch('/api/cards')).json()}catch(e){toast('Cards load failed')}
 $('#sv').hidden=true;$('#cg').hidden=false;cardsUI()}
function cardsUI(){
 $('#ccnt').textContent=C.length+' cards';
 $('#cg').innerHTML=C.length?C.map(c=>`<div class="note" data-id="${c.id}" style="background:${c.color}"><div class="nb md">${md(c.body,0,1)}</div><div class="na"><button data-a="e">Edit</button><button data-a="d">Delete</button></div></div>`).join(''):'<div class="mut">No cards yet. Tap "Add card".</div>';
 math($('#cg'));
 $('#cg').querySelectorAll('.note button').forEach(b=>b.onclick=async()=>{
  const id=+b.closest('.note').dataset.id;

function study(){
 if(!C.length)return toast('No cards yet');
 deck=shuf([...C]);di=0;$('#cg').hidden=true;$('#sv').hidden=false;deckUI()}
function deckUI(){
 const sv=$('#sv');
 if(di>=deck.length){sv.innerHTML=`<div class="card q">Round complete.<div class="acts"><button class="btn p" id="rs">Shuffle again</button><button class="btn" id="cl">Close</button></div></div>`;$('#rs').onclick=study;$('#cl').onclick=loadCards;return}
 const c=deck[di];
 sv.innerHTML=`<div class="qh" style="margin-top:16px"><span>${di+1} / ${deck.length}</span></div><div class="note lg md" style="background:${c.color}">${md(c.body,0,1)}</div><div class="acts" style="justify-content:center"><button class="btn p" id="dn">Next</button><button class="btn" id="cl">Close</button></div>`;
 math(sv);$('#dn').onclick=()=>{di++;deckUI()};$('#cl').onclick=loadCards}
$('#studyb').onclick=study;$('#addc').onclick=()=>openEd(null);

/* editor */
function swUI(){$('#csw').innerHTML=CC.map(c=>`<button data-c="${c}" style="background:${c}" class="${c===edColor?'on':''}"></button>`).join('');
 $('#csw').querySelectorAll('button').forEach(b=>b.onclick=()=>{edColor=b.dataset.c;swUI()})}
function openEd(c){
 edId=c?c.id:null;edColor=c?c.color:'#fff3a3';
 $('#edt').textContent=c?'Edit card':'New card';
 $('#edit').innerHTML=c?md(c.body,0,1):'';
 swUI();$('#ed').hidden=false;$('#edit').focus();document.execCommand('styleWithCSS',false,false)}
$('#ecancel').onclick=()=>$('#ed').hidden=true;
$('#tbar').onmousedown=e=>e.preventDefault();
$('#tbar').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;const c=b.dataset.c;$('#edit').focus();
 if(c==='h')document.execCommand('formatBlock',false,document.queryCommandValue('formatBlock').toLowerCase()==='h3'?'div':'h3');
 else if(c==='mark'){const t=getSelection().toString();if(t)document.execCommand('insertHTML',false,'<mark>'+esc(t)+'</mark>')}
 else if(c==='table'){
  const v=(prompt('Rows x Columns','3x2')||'').match(/(\d+)\s*[x×*,]\s*(\d+)/i);if(!v)return;
  const r=Math.min(+v[1],20),k=Math.min(+v[2],8);let h='<table>';
  for(let i=0;i<r;i++){h+='<tr>'+Array(k).fill(i?'<td>&nbsp;</td>':'<th>&nbsp;</th>').join('')+'</tr>'}
  document.execCommand('insertHTML',false,h+'</table><div><br></div>')}
 else if(c==='clear')document.execCommand('removeFormat');
 else document.execCommand(c)};
$('#edit').onpaste=e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))};
$('#esave').onclick=async()=>{
 const body=h2m($('#edit'));
 if(!body)return toast('Card is empty');
 try{edId?await post('/api/cards/'+edId,{body,color:edColor},'PUT'):await post('/api/cards',{body,color:edColor});
  $('#ed').hidden=true;if(!$('#t-cards').hidden)loadCards();else toast('Card saved',1)}
 catch(e){toast('Save failed: '+e)}};

/* HTML (editor) -> Markdown */
function h2m(root){
 const wrap=(s,m)=>{const t=s.trim();return t?s.match(/^\s*/)[0]+m+t+m+s.match(/\s*$/)[0]:s};
 const kids=n=>[...n.childNodes].map(node).join('');
 function node(n){
  if(n.nodeType===3)return n.textContent.replace(/\u00a0/g,' ');
  if(n.nodeType!==1)return'';
  const t=n.tagName.toLowerCase();
  switch(t){
   case'b':case'strong':return wrap(kids(n),'**');
   case'i':case'em':return wrap(kids(n),'*');
   case's':case'strike':case'del':return wrap(kids(n),'~~');
   case'u':return'<u>'+kids(n)+'</u>';
   case'mark':return'<mark>'+kids(n)+'</mark>';
   case'code':return'`'+kids(n)+'`';
   case'br':return'\n';
   case'h1':case'h2':case'h3':case'h4':case'h5':case'h6':return'\n\n'+'#'.repeat(+t[1])+' '+kids(n).trim()+'\n\n';
   case'ul':case'ol':return'\n\n'+[...n.children].filter(x=>x.tagName==='LI').map((li,i)=>(t==='ol'?(i+1)+'. ':'- ')+kids(li).trim().replace(/\n/g,'\n   ')).join('\n')+'\n\n';
   case'table':{
    const rows=[...n.querySelectorAll('tr')].map(r=>[...r.children].map(c=>kids(c).trim().replace(/\n+/g,'<br>').replace(/\|/g,'\\|')||' '));
    if(!rows.length)return'';
    const w=Math.max(...rows.map(r=>r.length)),row=r=>'| '+Array.from({length:w},(_,i)=>r[i]||' ').join(' | ')+' |';
    return'\n\n'+row(rows[0])+'\n|'+' --- |'.repeat(w)+'\n'+rows.slice(1).map(row).join('\n')+'\n\n'}
   case'p':return kids(n)+'\n\n';
   case'div':return kids(n)+'\n';
   default:return kids(n)}}
 return node(root).replace(/\n{3,}/g,'\n\n').trim()}

/* files */
function filesUI(){
 const F={};D.forEach(q=>(F[q.file]=F[q.file]||[]).push(q));
 const ks=Object.keys(SUBJ),names=Object.keys(F).sort((a,b)=>ks.indexOf(F[a][0].k)-ks.indexOf(F[b][0].k)||F[a][0].fn-F[b][0].fn);
 $('#fv').hidden=true;$('#fl').hidden=false;
 $('#fl').innerHTML=names.length?`<div class="tiles">`+names.map(n=>{const s=stats(F[n]);return`<button class="card tile" data-f="${n}"><b>${n.replace('.md','')}</b><span class="mut">${s.t} Q · ${s.a} done</span><div class="track"><i style="width:${pc(s.a,s.t)}%"></i></div></button>`}).join('')+`</div>`:'<div class="mut">No files.</div>';
 $('#fl').querySelectorAll('.tile').forEach(b=>b.onclick=()=>openFile(b.dataset.f))}
function openFile(n){
 const L=D.filter(q=>q.file===n).sort((a,b)=>a.n-b.n),s=stats(L);
 $('#fl').hidden=true;$('#fv').hidden=false;
 $('#fv').innerHTML=`<div class="tools"><button class="btn" id="fb">← Files</button><b>${n}</b><span class="mut">${s.t} Q · <span class="up">${s.c}</span> / <span class="dn">${s.i}</span> / <span class="sk">${s.s}</span></span></div>`+
 L.map(q=>`<div class="card q"><div class="qh"><span>Q${q.n}</span><span class="${sc(q.st)}">${q.st||'new'}</span></div><div class="stem">${md(q.stem)}</div>${q.opts.map((o,i)=>`<div class="opt done${i===q.ans?' ok':''}"><b>${'ABCD'[i]||i+1}</b><span>${md(o,1)}</span></div>`).join('')}${q.exp?`<div class="sol inset md">${md(q.exp)}</div>`:''}</div>`).join('');
 math($('#fv'));$('#fb').onclick=filesUI;scrollTo(0,0)}

/* settings */

 document.querySelectorAll('#theme button').forEach(b=>b.classList.toggle('on',b.dataset.v===P.theme));
 $('#sw').innerHTML=ACC.map(c=>`<button data-c="${c}" style="background:${c}" class="${c===P.accent?'on':''}"></button>`).join('')+`<input type="color" id="cc" value="${P.accent}">`;
 $('#sw').querySelectorAll('button').forEach(b=>b.onclick=()=>{P.accent=b.dataset.c;applyUI();setUI()});
 $('#cc').onchange=e=>{P.accent=e.target.value;applyUI();setUI()};
 $('#font').value=P.font;$('#size').value=P.size;$('#szv').textContent=P.size+'px'}
document.querySelectorAll('#theme button').forEach(b=>b.onclick=()=>{P.theme=b.dataset.v;applyUI();setUI()});
$('#font').onchange=e=>{P.font=e.target.value;applyUI()};
$('#size').oninput=e=>{P.size=+e.target.value;$('#szv').textContent=P.size+'px';applyUI()};
setUI();

 $('#gs').textContent=h.github?`Commits are batched every ${Math.round(h.sync_secs/60)} min. Pending files: ${h.pending}`:'GitHub storage is off (using local files).';
 $('#sync').hidden=!h.github})}
$('#sync').onclick=async()=>{try{const r=await post('/api/sync');toast(r.pending?`${r.pending} file(s) still pending`:'Synced',!r.pending);gh()}catch(e){toast('Sync failed: '+e)}};

$('#go').onclick=build;
const t0=localStorage.tab;
tab(['dash','questions','cards','files','settings'].includes(t0)?t0:'dash');
stc();
fetch('/api/data').then(r=>r.json()).then(d=>{D=d;dash();chips();stc();build();if(!$('#t-files').hidden)filesUI()}).catch(e=>toast('Load failed: '+e));
</script>
